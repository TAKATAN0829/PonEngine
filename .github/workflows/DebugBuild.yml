name: DebugBuild 
on:
  push:
    branches:
      -  master
env:
  # リポジトリのルートディレクトリを基点としたソリューションファイルのパス
  SOLUTION_FILE_PATH: project/CG2.sln
  # Visual Studioの構成（Debug/Release）
  CONFIGURATION: Debug

jobs: 
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@3
        with: 
          msbuild-architecture: x64
 
      - name: Build
        run: |
          msbuild ${{env.SOLUTION_FILE_PATH}}/p:platform=x64,Configuration=${{enc.CONFIGURATION}}
      
